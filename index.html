<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <!-- Cấu hình viewport ngăn chặn tự động zoom trên iPhone -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Ứng Dụng Quản Lý Chi Tiêu</title>
  
  <!-- Thư viện vẽ biểu đồ Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <!-- MÃ CSS -->
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #f5f5f7;
      color: #333;
      display: flex;
      justify-content: center;
    }

    .app-container {
      width: 100%;
      max-width: 480px;
      min-height: 100vh;
      background-color: #ffffff;
      display: flex;
      flex-direction: column;
      box-shadow: 0 0 10px rgba(0,0,0,0.05);
    }

    /* Menu chuyển lên đầu trang */
    .top-nav {
      display: flex;
      background-color: #f8f9fa;
      border-bottom: 1px solid #e9ecef;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .nav-btn {
      flex: 1;
      padding: 16px;
      border: none;
      background: none;
      font-size: 16px;
      font-weight: 600;
      color: #6c757d;
      cursor: pointer;
      border-bottom: 3px solid transparent;
      transition: all 0.2s ease;
    }

    .nav-btn.active {
      color: #007aff;
      border-bottom-color: #007aff;
    }

    /* Bố cục Tab */
    .tab-content {
      display: none;
      padding: 16px;
      flex: 1;
    }

    .tab-content.active {
      display: block;
    }

    /* ĐIỀU CHỈNH CHỐNG ZOOM TRÊN IPHONE:
       Font-size tối thiểu 16px cho tất cả các input/textarea/select */
    input[type="text"],
    input[type="number"],
    input[type="tel"],
    textarea,
    select {
      font-size: 16px !important; 
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      margin-top: 6px;
      background-color: #fff;
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-group label {
      font-size: 14px;
      font-weight: 500;
      color: #495057;
    }

    .btn-submit {
      width: 100%;
      padding: 14px;
      background-color: #007aff;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
    }

    /* Danh sách ghi chép */
    .list-section {
      margin-top: 24px;
    }

    .list-section h3 {
      font-size: 16px;
      margin-bottom: 12px;
      color: #495057;
    }

    .record-list {
      list-style: none;
    }

    .record-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 16px;
      background: #f8f9fa;
      border-radius: 8px;
      margin-bottom: 8px;
    }

    .record-info .note {
      font-weight: 600;
      display: block;
    }

    .record-info .time {
      font-size: 12px;
      color: #8e8e93;
    }

    .record-amount {
      font-weight: 700;
      color: #e63946;
    }

    /* Khung hiển thị biểu đồ tròn */
    .chart-section {
      margin-bottom: 32px;
      background: #fff;
      padding: 16px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
    }

    .chart-section h3 {
      margin-bottom: 16px;
      text-align: center;
      color: #333;
    }

    .chart-container {
      position: relative;
      width: 100%;
      max-width: 320px;
      margin: 0 auto;
    }
  </style>
</head>
<body>
  <div class="app-container">
    
    <!-- 1. Menu Ghi Chép & Báo Cáo chuyển lên đầu -->
    <header class="top-nav">
      <button class="nav-btn active" onclick="switchTab('tab1', event)">Ghi chép</button>
      <button class="nav-btn" onclick="switchTab('tab2', event)">Báo cáo</button>
    </header>

    <!-- TAB 1: GHI CHÉP -->
    <main id="tab1" class="tab-content active">
      <section class="form-section">
        <h2>Thêm Ghi Chép Mới</h2>
        <form id="record-form">
          <div class="form-group">
            <label for="amount">Số tiền:</label>
            <input type="number" id="amount" placeholder="Nhập số tiền..." required>
          </div>
          
          <div class="form-group">
            <label for="note">Ghi chú / Nội dung:</label>
            <input type="text" id="note" placeholder="Nhập ghi chú..." required>
          </div>

          <div class="form-group">
            <label for="category">Danh mục:</label>
            <select id="category">
              <option value="Ăn uống">Ăn uống</option>
              <option value="Mua sắm">Mua sắm</option>
              <option value="Di chuyển">Di chuyển</option>
              <option value="Khác">Khác</option>
            </select>
          </div>

          <button type="submit" class="btn-submit">Lưu ghi chép</button>
        </form>
      </section>

      <!-- Danh sách lịch sử ghi chép (Gần nhất lên đầu) -->
      <section class="list-section">
        <h3>Lịch sử ghi chép</h3>
        <ul id="record-list" class="record-list">
          <!-- Render tự động bằng JS -->
        </ul>
      </section>
    </main>

    <!-- TAB 2: BÁO CÁO -->
    <main id="tab2" class="tab-content">
      <!-- Biểu đồ Tuần (Tròn) -->
      <section class="chart-section">
        <h3>Biểu đồ tuần</h3>
        <div class="chart-container">
          <canvas id="weeklyChart"></canvas>
        </div>
      </section>

      <!-- Biểu đồ Tháng (Chuyển sang biểu đồ tròn giống tuần) -->
      <section class="chart-section">
        <h3>Biểu đồ tháng</h3>
        <div class="chart-container">
          <canvas id="monthlyChart"></canvas>
        </div>
      </section>
    </main>

  </div>

  <!-- MÃ JAVASCRIPT -->
  <script>
    // Dữ liệu mẫu ban đầu
    let records = [
      { id: 1, amount: 50000, note: "Cà phê sáng", category: "Ăn uống", createdAt: new Date("2026-09-18T08:30:00") },
      { id: 2, amount: 120000, note: "Ăn trưa", category: "Ăn uống", createdAt: new Date("2026-09-18T12:00:00") },
      { id: 3, amount: 200000, note: "Đổ xăng", category: "Di chuyển", createdAt: new Date("2026-09-19T09:15:00") }
    ];

    let weeklyChartInstance = null;
    let monthlyChartInstance = null;

    // Chuyển Tab
    function switchTab(tabId, event) {
      document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
      document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));

      document.getElementById(tabId).classList.add('active');
      if (event && event.target) {
        event.target.classList.add('active');
      }
      
      if (tabId === 'tab1') {
        renderRecords();
      } else if (tabId === 'tab2') {
        renderCharts();
      }
    }

    // Render danh sách ghi chép (Sắp xếp mới nhất lên đầu)
    function renderRecords() {
      const listElement = document.getElementById('record-list');
      listElement.innerHTML = '';

      // Sắp xếp thời gian giảm dần (Gần nhất/mới nhất lên đầu)
      const sortedRecords = [...records].sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));

      sortedRecords.forEach(record => {
        const li = document.createElement('li');
        li.className = 'record-item';
        
        const timeFormatted = new Date(record.createdAt).toLocaleString('vi-VN', {
          hour: '2-digit',
          minute: '2-digit',
          day: '2-digit',
          month: '2-digit'
        });

        li.innerHTML = `
          <div class="record-info">
            <span class="note">${record.note} (${record.category})</span>
            <span class="time">${timeFormatted}</span>
          </div>
          <div class="record-amount">-${record.amount.toLocaleString('vi-VN')} đ</div>
        `;
        listElement.appendChild(li);
      });
    }

    // Xử lý Form Thêm ghi chép
    document.getElementById('record-form').addEventListener('submit', function(e) {
      e.preventDefault();

      const amountInput = document.getElementById('amount');
      const noteInput = document.getElementById('note');
      const categoryInput = document.getElementById('category');

      const newRecord = {
        id: Date.now(),
        amount: parseFloat(amountInput.value),
        note: noteInput.value,
        category: categoryInput.value,
        createdAt: new Date()
      };

      records.push(newRecord);

      // Reset Form
      amountInput.value = '';
      noteInput.value = '';

      renderRecords();
    });

    // Render Biểu đồ tròn cho cả Tuần và Tháng
    function renderCharts() {
      const categories = ['Ăn uống', 'Mua sắm', 'Di chuyển', 'Khác'];
      
      const dataValues = categories.map(cat => {
        return records
          .filter(r => r.category === cat)
          .reduce((sum, r) => sum + r.amount, 0);
      });

      const chartColors = ['#ff6384', '#36a2eb', '#cc65fe', '#ffce56'];

      const chartConfig = {
        type: 'doughnut',
        data: {
          labels: categories,
          datasets: [{
            data: dataValues,
            backgroundColor: chartColors
          }]
        },
        options: {
          responsive: true,
          plugins: {
            legend: {
              position: 'bottom'
            }
          }
        }
      };

      // Biểu đồ Tuần
      if (weeklyChartInstance) weeklyChartInstance.destroy();
      const ctxWeekly = document.getElementById('weeklyChart').getContext('2d');
      weeklyChartInstance = new Chart(ctxWeekly, chartConfig);

      // Biểu đồ Tháng (Biểu đồ Tròn)
      if (monthlyChartInstance) monthlyChartInstance.destroy();
      const ctxMonthly = document.getElementById('monthlyChart').getContext('2d');
      monthlyChartInstance = new Chart(ctxMonthly, chartConfig);
    }

    // Chạy khi tải trang
    document.addEventListener('DOMContentLoaded', () => {
      renderRecords();
    });
  </script>
</body>
</html>
