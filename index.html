<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Quản lý Chi tiêu</title>

  <style>
    :root {
      --bg: #f2f2f7;
      --card: #ffffff;
      --text: #1c1c1e;
      --muted: #8e8e93;
      --primary: #007aff;
      --danger: #ff3b30;
      --success: #34c759;
      --shadow: 0 4px 16px rgba(0,0,0,0.06);
      --radius: 14px;
      --pad: 16px;
      --gap: 12px;
      --container-max: 600px;
    }

    *, *::before, *::after { box-sizing: border-box; }
    input, button, select, textarea, canvas { max-width: 100%; display: block; }
    html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
    * { -webkit-tap-highlight-color: transparent; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      margin: 0;
      padding-bottom: 80px; /* Nhường chỗ cho Nav Bottom */
    }

    @supports(padding: env(safe-area-inset-top)){
      body {
        padding-left: max(0px, env(safe-area-inset-left));
        padding-right: max(0px, env(safe-area-inset-right));
      }
    }

    .container {
      max-width: var(--container-max);
      margin: 16px auto;
      padding: 0 16px;
    }

    h1 { font-size: 22px; text-align: center; margin: 12px 0 20px; }
    h2 { font-size: 16px; margin: 0 0 12px; }

    .card {
      background: var(--card);
      padding: var(--pad);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      margin-bottom: var(--gap);
      overflow: hidden;
    }

    label { font-size: 12px; color: var(--muted); display: block; margin-bottom: 4px; }

    input, select, button {
      width: 100%;
      min-height: 44px;
      font-size: 15px;
      border-radius: 10px;
    }

    input, select {
      padding: 10px 12px;
      margin-bottom: 12px;
      border: 1px solid #e3e3e8;
      background: #fafafa;
      outline: none;
    }

    input:focus, select:focus {
      border-color: var(--primary);
      background: #fff;
      box-shadow: 0 0 0 3px rgba(0,122,255,0.12);
    }

    button {
      padding: 10px 12px;
      border: none;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: transform .05s ease, filter .15s ease;
    }
    button:active { transform: translateY(1px); }

    .btn-primary { background: var(--primary); color: #fff; }
    .btn-success { background: var(--success); color: #fff; }
    .btn-danger { background: var(--danger); color: #fff; }

    /* Floating Action Button (+) */
    .fab {
      position: fixed;
      right: 20px;
      bottom: 80px;
      width: 56px;
      height: 56px;
      border-radius: 28px;
      background: var(--primary);
      color: #fff;
      font-size: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 6px 16px rgba(0,122,255,0.35);
      cursor: pointer;
      z-index: 90;
    }

    /* Modal dạng Pop-up/Sheet */
    .modal-overlay {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.4);
      display: none;
      align-items: flex-end;
      justify-content: center;
      z-index: 1000;
    }
    .modal-overlay.active { display: flex; }

    .modal-card {
      background: var(--card);
      width: 100%;
      max-width: var(--container-max);
      padding: 20px;
      border-radius: 20px 20px 0 0;
      box-shadow: var(--shadow);
      animation: slideUp 0.2s ease-out;
    }

    @keyframes slideUp {
      from { transform: translateY(100%); }
      to { transform: translateY(0); }
    }

    /* Danh sách khoản chi */
    .expense-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 0;
      border-bottom: 1px solid #efeff4;
    }
    .expense-item:last-child { border-bottom: none; }
    .expense-info .title { font-weight: 600; font-size: 15px; margin-bottom: 2px; }
    .expense-info .sub { font-size: 12px; color: var(--muted); }
    .expense-amount { font-weight: 700; color: var(--danger); font-size: 15px; text-align: right; }

    .del-btn {
      background: none; border: none; color: var(--muted); width: auto; min-height: unset;
      padding: 4px 8px; font-size: 14px; margin-left: 8px;
    }
    .del-btn:hover { color: var(--danger); }

    /* Thanh Tab Bar phía dưới */
    .tab-bar {
      position: fixed; bottom: 0; left: 0; right: 0;
      height: 60px;
      background: #ffffffd0;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-top: 1px solid #e3e3e8;
      display: flex;
      justify-content: space-around;
      align-items: center;
      z-index: 99;
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }

    .tab-item {
      flex: 1; text-align: center; color: var(--muted); font-size: 11px; cursor: pointer;
      display: flex; flex-direction: column; align-items: center; gap: 2px;
    }
    .tab-item.active { color: var(--primary); font-weight: 600; }
    .tab-item .icon { font-size: 20px; }

    .tab-content { display: none; }
    .tab-content.active { display: block; }

    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    
    #summaryTotal {
      font-size: 20px;
      font-weight: 700;
      color: var(--danger);
      text-align: center;
      margin: 8px 0;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>💸 Quản Lý Chi Tiêu</h1>

    <!-- TAB 1: GHI CHÉP -->
    <div id="tab-record" class="tab-content active">
      <div class="card">
        <h2>Danh sách chi tiêu hôm nay</h2>
        <div id="todayExpenseList"></div>
      </div>

      <div class="card">
        <h2>Tất cả khoản chi gần đây</h2>
        <div id="recentExpenseList"></div>
      </div>

      <!-- Nút + Nổi -->
      <div class="fab" onclick="openModal()">+</div>
    </div>

    <!-- TAB 2: TỔNG HỢP & BÁO CÁO -->
    <div id="tab-report" class="tab-content">
      <div class="card">
        <h2>📅 Bộ lọc thời gian</h2>
        <div class="grid-2">
          <div>
            <label for="filterMode">Xem theo</label>
            <select id="filterMode" onchange="renderReport()">
              <option value="month">Tháng</option>
              <option value="year">Năm</option>
            </select>
          </div>
          <div>
            <label for="filterDate">Chọn thời gian</label>
            <input type="month" id="filterDate" onchange="renderReport()">
          </div>
        </div>
      </div>

      <div class="card">
        <label>Tổng chi tiêu trong kỳ</label>
        <div id="summaryTotal">0 VND</div>
      </div>

      <div class="card">
        <h2>📊 Phân bổ theo danh mục</h2>
        <canvas id="reportChart" style="max-height:240px; width:100%;"></canvas>
        <div id="categoryBreakdown" style="margin-top:16px;"></div>
      </div>

      <div class="card">
        <h2>🗂️ Sao lưu & Phục hồi</h2>
        <button class="btn-primary" onclick="exportData()" style="margin-bottom:10px;">📤 Xuất dữ liệu (.json)</button>
        <input type="file" id="importFile" accept=".json" style="display:none" onchange="importData(event)">
        <button class="btn-success" onclick="document.getElementById('importFile').click()">📥 Phục hồi dữ liệu</button>
      </div>
    </div>
  </div>

  <!-- MODAL THÊM MỚI KHOẢN CHI -->
  <div class="modal-overlay" id="expenseModal" onclick="closeModalOnOverlay(event)">
    <div class="modal-card">
      <h2 style="margin-bottom:16px;">Thêm khoản chi mới</h2>
      
      <label for="expAmount">Số tiền (VND)</label>
      <input type="text" id="expAmount" inputmode="numeric" placeholder="0">

      <label for="expCategory">Danh mục</label>
      <select id="expCategory">
        <option value="Ân uống">🍜 Ăn uống</option>
        <option value="Đi lại">⛽ Đi lại / Mua xăng</option>
        <option value="Mua sắm">🛍️ Mua sắm</option>
        <option value="Hóa đơn">🧾 Hóa đơn & Tiện ích</option>
        <option value="Giải trí">🎬 Giải trí</option>
        <option value="Khác">📌 Khác</option>
      </select>

      <label for="expNote">Ghi chú</label>
      <input type="text" id="expNote" placeholder="Ví dụ: Ăn sáng, Cà phê...">

      <label for="expDate">Ngày thực hiện</label>
      <input type="date" id="expDate">

      <div class="grid-2" style="margin-top:8px;">
        <button type="button" style="background:#e5e5ea; color:#333;" onclick="closeModal()">Hủy</button>
        <button type="button" class="btn-primary" onclick="addExpense()">Lưu khoản chi</button>
      </div>
    </div>
  </div>

  <!-- TAB BAR -->
  <div class="tab-bar">
    <div class="tab-item active" onclick="switchTab('record', this)">
      <span class="icon">📝</span>
      <span>Ghi chép</span>
    </div>
    <div class="tab-item" onclick="switchTab('report', this)">
      <span class="icon">📊</span>
      <span>Tổng hợp</span>
    </div>
  </div>

  <script>
    /* ===== STATE & DATA ===== */
    let expenses = [];
    const CATEGORIES = ["Ăn uống", "Đi lại", "Mua sắm", "Hóa đơn", "Giải trí", "Khác"];
    const CAT_COLORS = ['#ff9500', '#34c759', '#af52de', '#007aff', '#ff2d55', '#8e8e93'];

    /* ===== UTILS ===== */
    function getTodayStr() {
      const d = new Date();
      return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    }

    function getCurrentMonthStr() {
      const d = new Date();
      return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
    }

    function formatNum(n) {
      return (Number(n) || 0).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ".");
    }

    function parseNum(str) {
      return Number((str || "").toString().replace(/\./g, "")) || 0;
    }

    /* Auto format input số tiền */
    const expAmountInput = document.getElementById('expAmount');
    expAmountInput.addEventListener('input', () => {
      let v = expAmountInput.value.replace(/\D/g, "");
      expAmountInput.value = v ? formatNum(v) : "";
    });

    /* ===== LOCAL STORAGE ===== */
    function saveData() {
      localStorage.setItem("expenses_data", JSON.stringify(expenses));
    }

    function loadData() {
      expenses = JSON.parse(localStorage.getItem("expenses_data")) || [];
    }

    /* ===== TAB NAVIGATION ===== */
    function switchTab(tabName, el) {
      document.querySelectorAll('.tab-content').forEach(tc => tc.classList.remove('active'));
      document.querySelectorAll('.tab-item').forEach(ti => ti.classList.remove('active'));

      document.getElementById('tab-' + tabName).classList.add('active');
      el.classList.add('active');

      if (tabName === 'report') renderReport();
      else renderRecords();
    }

    /* ===== MODAL CONTROL ===== */
    function openModal() {
      document.getElementById('expDate').value = getTodayStr();
      document.getElementById('expAmount').value = "";
      document.getElementById('expNote').value = "";
      document.getElementById('expenseModal').classList.add('active');
      setTimeout(() => document.getElementById('expAmount').focus(), 100);
    }

    function closeModal() {
      document.getElementById('expenseModal').classList.remove('active');
    }

    function closeModalOnOverlay(e) {
      if (e.target.classList.contains('modal-overlay')) closeModal();
    }

    /* ===== CRUD EXPENSE ===== */
    function addExpense() {
      const amount = parseNum(document.getElementById('expAmount').value);
      const category = document.getElementById('expCategory').value;
      const note = document.getElementById('expNote').value.trim();
      const date = document.getElementById('expDate').value || getTodayStr();

      if (amount <= 0) {
        alert("Vui lòng nhập số tiền hợp lệ!");
        return;
      }

      expenses.unshift({
        id: Date.now(),
        amount,
        category,
        note,
        date
      });

      saveData();
      closeModal();
      renderRecords();
    }

    function deleteExpense(id) {
      if (confirm("Xóa khoản chi này?")) {
        expenses = expenses.filter(e => e.id !== id);
        saveData();
        renderRecords();
        renderReport();
      }
    }

    /* ===== RENDER GHI CHÉP ===== */
    function renderRecords() {
      const today = getTodayStr();
      const todayListEl = document.getElementById('todayExpenseList');
      const recentListEl = document.getElementById('recentExpenseList');

      const todayItems = expenses.filter(e => e.date === today);
      const recentItems = expenses.slice(0, 30); // Lấy 30 mục mới nhất

      const createHtml = (item) => `
        <div class="expense-item">
          <div class="expense-info">
            <div class="title">${item.note || item.category}</div>
            <div class="sub">${item.category} • ${item.date}</div>
          </div>
          <div style="display:flex; align-items:center;">
            <div class="expense-amount">-${formatNum(item.amount)} đ</div>
            <button class="del-btn" onclick="deleteExpense(${item.id})">✕</button>
          </div>
        </div>
      `;

      todayListEl.innerHTML = todayItems.length 
        ? todayItems.map(createHtml).join('') 
        : '<p style="color:var(--muted);font-size:13px;text-align:center;">Hôm nay chưa có chi tiêu nào.</p>';

      recentListEl.innerHTML = recentItems.length 
        ? recentItems.map(createHtml).join('') 
        : '<p style="color:var(--muted);font-size:13px;text-align:center;">Chưa có dữ liệu.</p>';
    }

    /* ===== RENDER BÁO CÁO ===== */
    function renderReport() {
      const mode = document.getElementById('filterMode').value;
      const filterDate = document.getElementById('filterDate').value || getCurrentMonthStr();

      // Cập nhật kiểu ô input thời gian
      const dateInput = document.getElementById('filterDate');
      dateInput.type = mode === 'month' ? 'month' : 'number';
      if (mode === 'year' && dateInput.value.length > 4) {
        dateInput.value = new Date().getFullYear();
      }

      // Lọc danh sách
      const filtered = expenses.filter(e => {
        if (mode === 'month') return e.date.startsWith(filterDate);
        if (mode === 'year') return e.date.startsWith(filterDate.toString());
        return true;
      });

      // Tính tổng
      const total = filtered.reduce((sum, e) => sum + e.amount, 0);
      document.getElementById('summaryTotal').innerText = `${formatNum(total)} VND`;

      // Nhóm theo danh mục
      const catTotals = {};
      CATEGORIES.forEach(c => catTotals[c] = 0);
      filtered.forEach(e => {
        if (catTotals[e.category] !== undefined) catTotals[e.category] += e.amount;
        else catTotals["Khác"] += e.amount;
      });

      // Render danh sách phân bổ
      const breakdownEl = document.getElementById('categoryBreakdown');
      breakdownEl.innerHTML = CATEGORIES.map((cat, idx) => {
        const amt = catTotals[cat];
        if (amt === 0) return '';
        const pct = total > 0 ? ((amt / total) * 100).toFixed(1) : 0;
        return `
          <div style="display:flex; justify-content:space-between; font-size:13px; margin-bottom:8px;">
            <span><span style="color:${CAT_COLORS[idx]}; font-weight:bold;">●</span> ${cat} (${pct}%)</span>
            <b>${formatNum(amt)} VND</b>
          </div>
        `;
      }).join('');

      drawReportChart(Object.values(catTotals), total);
    }

    /* ===== BIEU DO CANVAS (NATIVE) ===== */
    function drawReportChart(dataArr, total) {
      const canvas = document.getElementById('reportChart');
      const ctx = canvas.getContext('2d');
      const dpr = window.devicePixelRatio || 1;

      const w = canvas.parentElement.clientWidth || 300;
      const h = 240;
      canvas.width = w * dpr;
      canvas.height = h * dpr;
      canvas.style.height = h + "px";

      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.clearRect(0, 0, w, h);

      const cx = w / 2;
      const cy = h / 2;
      const radius = Math.min(w, h) / 2 - 16;

      if (total <= 0) {
        ctx.fillStyle = '#8e8e93';
        ctx.font = '14px -apple-system, sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('Chưa có dữ liệu chi tiêu', cx, cy);
        return;
      }

      let startAngle = -Math.PI / 2;
      dataArr.forEach((val, i) => {
        if (val <= 0) return;
        const sliceAngle = (val / total) * 2 * Math.PI;
        const endAngle = startAngle + sliceAngle;

        ctx.beginPath();
        ctx.moveTo(cx, cy);
        ctx.arc(cx, cy, radius, startAngle, endAngle);
        ctx.closePath();
        ctx.fillStyle = CAT_COLORS[i];
        ctx.fill();

        startAngle = endAngle;
      });

      // Tạo lỗ ở giữa (Donut Chart)
      ctx.beginPath();
      ctx.arc(cx, cy, radius * 0.55, 0, Math.PI * 2);
      ctx.fillStyle = '#ffffff';
      ctx.fill();
    }

    /* ===== SAO LƯU & PHỤC HỒI ===== */
    function exportData() {
      const blob = new Blob([JSON.stringify(expenses, null, 2)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = `ChiTieu_Backup_${getTodayStr()}.json`;
      a.click();
      URL.revokeObjectURL(url);
    }

    function importData(e) {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(evt) {
        try {
          const data = JSON.parse(evt.target.result);
          if (Array.isArray(data) && confirm("Dữ liệu hiện tại sẽ bị ghi đè. Bạn chắc chắn chứ?")) {
            expenses = data;
            saveData();
            renderRecords();
            renderReport();
            alert("Phục hồi dữ liệu thành công!");
          }
        } catch (err) {
          alert("File không hợp lệ!");
        }
      };
      reader.readAsText(file);
    }

    /* ===== INIT ===== */
    window.onload = function() {
      document.getElementById('filterDate').value = getCurrentMonthStr();
      loadData();
      renderRecords();
    };
  </script>
</body>
</html>
