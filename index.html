<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <!-- Cấu hình viewport ngăn chặn tự động zoom trên iPhone -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Ứng Dụng Quản Lý Chi Tiêu</title>
  <link rel="stylesheet" href="style.css">
  <!-- Thư viện vẽ biểu đồ Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
  <div class="app-container">
    
    <!-- 1. Menu Ghi Chép & Báo Cáo được chuyển lên đầu -->
    <header class="top-nav">
      <button class="nav-btn active" onclick="switchTab('tab1')">Ghi chép</button>
      <button class="nav-btn" onclick="switchTab('tab2')">Báo cáo</button>
    </header>

    <!-- MÀN HÌNH TAB 1: GHI CHÉP -->
    <main id="tab1" class="tab-content active">
      <section class="form-section">
        <h2>Thêm Ghi Chép Mới</h2>
        <form id="record-form">
          <div class="form-group">
            <label for="amount">Số tiền:</label>
            <input type="number" id="amount" placeholder="Nhập số tiền..." required>
          </div>
          
          <div class="form-group">
            <label for="note">Ghi chú / Nội dung:</label>
            <input type="text" id="note" placeholder="Nhập ghi chú..." required>
          </div>

          <div class="form-group">
            <label for="category">Danh mục:</label>
            <select id="category">
              <option value="Ăn uống">Ăn uống</option>
              <option value="Mua sắm">Mua sắm</option>
              <option value="Di chuyển">Di chuyển</option>
              <option value="Khác">Khác</option>
            </select>
          </div>

          <button type="submit" class="btn-submit">Lưu ghi chép</button>
        </form>
      </section>

      <!-- Danh sách lịch sử ghi chép (Gần nhất lên đầu) -->
      <section class="list-section">
        <h3>Lịch sử ghi chép</h3>
        <ul id="record-list" class="record-list">
          <!-- Danh sách sẽ được render tự động qua JS -->
        </ul>
      </section>
    </main>

    <!-- MÀN HÌNH TAB 2: BÁO CÁO -->
    <main id="tab2" class="tab-content">
      <!-- Biểu đồ Tuần (Biểu đồ tròn) -->
      <section class="chart-section">
        <h3>Biểu đồ tuần</h3>
        <div class="chart-container">
          <canvas id="weeklyChart"></canvas>
        </div>
      </section>

      <!-- Biểu đồ Tháng (Đã chuyển sang biểu đồ tròn giống tuần, bỏ nhãn tên loại biểu đồ) -->
      <section class="chart-section">
        <h3>Biểu đồ tháng</h3>
        <div class="chart-container">
          <canvas id="monthlyChart"></canvas>
        </div>
      </section>
    </main>

  </div>

  <script src="app.js"></script>
</body>
</html>
